</style></head><body><header><a href="https://www.appopener.in/" aria-label="AppOpener home">SUMU</a><span>THE FIRST LISTEN</span></header><main><img class="cover" src="./sumu-cover-640-v1.webp" width="640" height="640" alt="SUMU: two glowing doorways into sunset worlds"><section aria-labelledby="song-title"><span class="eyebrow">18 SECONDS / ONE DREAM</span><p class="artist">SUMU</p><h1 id="song-title">Record<br>On This.</h1><p class="story">Ek khwaab.<br>Ab tumhare kaanon tak.</p><div class="line"></div><div class="player"><div class="actions"><button id="listen" type="button" aria-pressed="false">▶ Listen · 18 sec</button><button id="share" type="button">Pass it on ↗</button></div><audio id="teaser" preload="none" aria-label="Record On This by SUMU, 18-second teaser" controls hidden></audio><p id="status" class="status" role="status">Press play for your first listen.</p><div class="manual" id="manual" hidden><label for="share-link">Copy this link to share</label><input id="share-link" readonly value="https://www.appopener.in/sumu/record-on-this"></div><p class="next">Full song planned for YouTube.</p><noscript><p>JavaScript enables the player. <a href="./record-on-this-18s-v1.mp3">Open the 18-second teaser</a>.</p></noscript></div></section></main><footer><span>© 2026 SUMU · Record On This</span><a href="https://www.appopener.in/">A first listen on AppOpener ↗</a></footer>
<script>
(() => {
  'use strict';
  const audio=document.getElementById('teaser'),listen=document.getElementById('listen'),status=document.getElementById('status');
  const source='./record-on-this-18s-v1.mp3',url='https://www.appopener.in/sumu/record-on-this';
  function paused(){listen.textContent='▶ Listen · 18 sec';listen.setAttribute('aria-pressed','false');document.body.classList.remove('is-playing');}
  listen.addEventListener('click',async()=>{
    if(!audio.paused){audio.pause();return;}
    if(!audio.getAttribute('src')||audio.error){audio.src=source;audio.load();}
    if(audio.ended)audio.currentTime=0;
    audio.hidden=false;status.textContent='Opening your first listen…';
    try{await audio.play();}catch{paused();status.textContent='The teaser could not play. Press play to retry.';}
  });
  audio.addEventListener('playing',()=>{listen.textContent='Ⅱ Pause teaser';listen.setAttribute('aria-pressed','true');status.textContent='SUMU — Record On This';document.body.classList.add('is-playing');});
  audio.addEventListener('pause',paused);
  audio.addEventListener('ended',()=>{paused();status.textContent='That was your first listen. Pass it on.';});
  audio.addEventListener('error',()=>{paused();status.textContent='The teaser is unavailable. Press play to retry.';});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)audio.pause();});
  window.addEventListener('pagehide',()=>{audio.pause();audio.removeAttribute('src');audio.load();});
  document.getElementById('share').addEventListener('click',async()=>{
    if(navigator.share){try{await navigator.share({title:'SUMU — Record On This',text:'Ek khwaab. Ab tumhare kaanon tak. Hear the first 18 seconds.',url});status.textContent='Thanks for passing it on.';return;}catch(error){if(error.name==='AbortError')return;}}
    try{await navigator.clipboard.writeText(url);status.textContent='Link copied. Send it to someone who should hear this.';}catch{document.getElementById('manual').hidden=false;const field=document.getElementById('share-link');field.focus();field.select();status.textContent='Copy the link below to share.';}
  });
})();
